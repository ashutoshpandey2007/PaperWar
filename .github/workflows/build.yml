name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          cd PaperWar
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PaperWar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PaperWar-apk
          path: PaperWar/app/build/outputs/apk/debug/PaperWar.apk
