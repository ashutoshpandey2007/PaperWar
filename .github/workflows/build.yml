name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      
      - name: Decode Keystore
        run: |
          cd PaperWar
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/paperwar-release.jks

      - name: Build Release APK
        run: |
          cd PaperWar
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/paperwar-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PaperWar-Release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWar-Release-apk
          path: PaperWar/app/build/outputs/apk/release/PaperWar-Release.apk
