name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PaperWar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PaperWar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWar-apk
          path: PaperWar/app/build/outputs/apk/debug/*.apk

      # Signed release build: only runs if the keystore secret exists
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.have == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PaperWar.apk

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.have == 'true'
        with:
          name: PaperWar-release-apk
          path: PaperWar/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: steps.ks.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" \
            app/build/outputs/apk/release/PaperWar.apk \
            --repo "${{ github.repository }}" \
            --title "Paper War v2.0.${{ github.run_number }}" \
            --generate-notes
